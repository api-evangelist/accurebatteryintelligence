  checked:
  - id: opc-ua
    conforms: false
    claimed: true
    evidence: https://www.accure.net/battery-analytics/battery-intelligence
    note: >-
      PROSE CLAIM ONLY, DELIBERATELY NOT CREDITED. ACCURE's product page states "Open
      REST and OPC-UA interfaces stream data to CMMS or market-dispatch tools, while
      SFTP and API endpoints pull historical logs from virtually any BMS." OPC UA
