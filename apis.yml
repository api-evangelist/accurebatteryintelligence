aid: accurebatteryintelligence
name: ACCURE Battery Intelligence
description: 'ACCURE Battery Intelligence GmbH (Aachen, Germany, founded 2020) builds cloud
  battery analytics software for grid-scale battery energy storage systems (BESS), electric
  vehicle fleets and stationary storage. Its platform ingests telemetry from BMS, EMS and PCS
  systems and applies predictive models for safety, performance, state-of-charge accuracy,
  lifetime and warranty management. The customer-facing product is the ACCURE platform at
  accure-platform.com, an Auth0-protected single-page application backed by an API gateway at
  gateway.accure-platform.com. ACCURE states the platform offers open REST and OPC-UA
  interfaces, SFTP and API endpoints for historical BMS logs, single sign-on and webhooks, but
  publishes no public developer portal, API reference or machine-readable contract.'
