      plausible, but domain_standard_conformance reads the CONTRACT, not a marketing
      page. ACCURE publishes no OPC UA address-space model, no nodeset file, and no
      machine-readable contract of any kind, so nothing can be verified. Recorded as a
      claim to chase, not as a conformance.
