apis:
- aid: accurebatteryintelligence-platform
  name: ACCURE Battery Intelligence Platform API
  description: 'The authenticated API gateway behind the ACCURE battery analytics platform.
    Established by probe, not by documentation: the platform single-page application at
    accure-platform.com declares VITE_AUTH0_AUDIENCE "https://gateway.accure-platform.com"
    against the Auth0 tenant production-accure.eu.auth0.com, and that host answers HTTP
    requests (403 from the edge, and a Fastify JSON 404 envelope on routes that reach the
    application). ACCURE publishes no OpenAPI, no API reference and no developer portal for
    it; every route requires an Auth0-issued bearer token. Recorded as an auth-gated surface,
    not a documented one.'
